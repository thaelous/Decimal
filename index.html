<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego: Alineación Decimal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 550px;
            margin: 20px 0;
        }
        h2 { margin-bottom: 10px; color: #e94560; }
        
        /* Operación explícita inicial */
        .explicit-operation {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            color: #f1c40f;
            letter-spacing: 2px;
        }

        /* Contenedor de filas con más espacio hacia el disparador */
        .row-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 40px 0 60px 0; /* Más espacio abajo para el disparador */
            position: relative;
            height: 100px;
            justify-content: center;
            align-items: center;
        }
        .number-row {
            display: flex;
            gap: 6px;
            align-items: center;
            transition: transform 0.05s linear;
        }
        
        /* Bloques individuales por dígito estilo 3D */
        .block-3d {
            background: linear-gradient(135deg, #0f3460, #1f4068);
            border: 2px solid #e94560;
            width: 35px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 4px 0 #b32e43;
            font-size: 22px;
            font-weight: bold;
        }
        .block-empty {
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(233, 69, 96, 0.4);
            box-shadow: none;
        }

        /* Esfera vistosa exactamente al nivel del punto */
        .sphere-dot {
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            border-radius: 50%;
            box-shadow: 0 0 12px #ff6b6b, inset -2px -2px 4px rgba(0,0,0,0.6);
            margin: 0 8px;
            align-self: flex-end; /* Alineado abajo, a la altura base de los números */
            margin-bottom: 5px;
        }
        
        /* Zona del disparador con la flecha indicadora */
        .shooter-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 8px;
        }
        .shooter-arrow {
            font-size: 28px;
            color: #f1c40f;
            animation: bounceArrow 0.6s infinite alternate;
        }
        @keyframes bounceArrow {
            from { transform: translateY(0); }
            to { transform: translateY(8px); }
        }

        /* Botones generales */
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #b32e43;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b32e43;
        }

        /* Sección de respuesta */
        .answer-section {
            display: none;
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 20px;
            width: 200px;
            text-align: center;
            border-radius: 5px;
            border: 2px solid #0f3460;
            margin-bottom: 15px;
        }
        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .flash {
            animation: flashEffect 0.3s ease;
        }
        @keyframes flashEffect {
            0% { background-color: #16213e; }
            50% { background-color: #ff6b6b; }
            100% { background-color: #16213e; }
        }
    </style>
</head>
<body>

    <div class="container" id="gameContainer">
        <h2>Alineación de Decimales</h2>
        <p id="instruction">Observa la operación de suma:</p>

        <!-- Suma explícita -->
        <div class="explicit-operation" id="explicitOp">73.4 + 13.579</div>

        <div class="row-container" id="rowContainer">
            <!-- Se carga inicialmente con números normales por dígito -->
        </div>

        <div class="shooter-area" id="shooterArea">
            <div class="shooter-arrow" id="shooterArrow" style="display: none;"></div>
            <button class="btn" id="mainButton" onclick="handleButtonClick()">Iniciar</button>
        </div>
        
        <div class="answer-section" id="answerSection">
            <input type="text" id="userAnswer" placeholder="Tu respuesta">
            <br>
            <button class="btn" onclick="checkAnswer()">Puntuar</button>
        </div>

        <div class="message" id="messageBox"></div>
    </div>

    <script>
        let gameState = 'waiting'; // waiting, playing, answering
        let animInterval;
        let offset1 = 0;
        let offset2 = 0;
        let speed1 = 2.5;
        let speed2 = -3.5;

        const opData = {
            correctSum: 86.979
        };

        // Vista inicial con números por dígito (sin cuadros 3D todavía)
        function initView() {
            const container = document.getElementById('rowContainer');
            container.innerHTML = `
                <div class="number-row">
                    <div class="block-3d">7</div>
                    <div class="block-3d">3</div>
                    <div style="color:#ff6b6b; font-size:26px; font-weight:bold; margin:0 4px;">.</div>
                    <div class="block-3d">4</div>
                    <div style="width:20px;"></div>
                </div>
                <div class="number-row" style="position:relative; left: 15px;">
                    <div class="block-3d">+</div>
                    <div style="width:10px;"></div>
                    <div class="block-3d">1</div>
                    <div class="block-3d">3</div>
                    <div style="color:#ff6b6b; font-size:26px; font-weight:bold; margin:0 4px;">.</div>
                    <div class="block-3d">5</div>
                    <div class="block-3d">7</div>
                    <div class="block-3d">9</div>
                </div>
            `;
        }
        initView();

        function handleButtonClick() {
            if (gameState === 'waiting') {
                gameState = 'playing';
                document.getElementById('explicitOp.style.display') // opcional
                document.getElementById('mainButton').innerText = "¡Dispara!";
                document.getElementById('shooterArrow').style.display = 'block';
                document.getElementById('shooterArrow').innerText = "▲";
                document.getElementById('instruction').innerText = "¡Dispara cuando las esferas estén alineadas!";
                startDiscordantMotion();
            } else if (gameState === 'playing') {
                tryShoot();
            }
        }

        function startDiscordantMotion() {
            const container = document.getElementById('rowContainer');
            animInterval = setInterval(() => {
                offset1 += speed1;
                offset2 += speed2;

                if (offset1 > 55 || offset1 < -55) speed1 *= -1;
                if (offset2 > 55 || offset2 < -55) speed2 *= -1;

                // Ahora sí aparecen los cuadros 3D por dígito con sus esferas a nivel del punto
                container.innerHTML = `
                    <div class="number-row" style="transform: translateX(${offset1}px);">
                        <div class="block-3d block-empty"></div>
                        <div class="block-3d block-empty"></div>
                        <div class="sphere-dot"></div>
                        <div class="block-3d block-empty"></div>
                        <div style="width:20px;"></div>
                    </div>
                    <div class="number-row" style="transform: translateX(${offset2}px);">
                        <div class="block-3d block-empty" style="opacity:0; border:none;"></div>
                        <div style="width:10px;"></div>
                        <div class="block-3d block-empty"></div>
                        <div class="block-3d block-empty"></div>
                        <div class="sphere-dot"></div>
                        <div class="block-3d block-empty"></div>
                        <div class="block-3d block-empty"></div>
                        <div class="block-3d block-empty"></div>
                    </div>
                `;
            }, 30);
        }

        function tryShoot() {
            document.getElementById('gameContainer').classList.add('flash');
            setTimeout(() => document.getElementById('gameContainer').classList.remove('flash'), 300);

            let diferencia = Math.abs(offset1 - offset2);
            
            if (diferencia < 6) {
                // ¡Acierto!
                clearInterval(animInterval);
                document.getElementById('shooterArea').style.display = 'none';
                document.getElementById('explicitOp').style.display = 'none';
                document.getElementById('instruction').innerText = "¡Excelente! Escribe el resultado de la suma:";
                document.getElementById('answerSection').style.display = 'block';
                document.getElementById('messageBox').style.color = '#2ecc71';
                document.getElementById('messageBox').innerText = "¡Alineación perfecta!";
                gameState = 'answering';
            } else {
                document.getElementById('messageBox').style.color = '#e94560';
                document.getElementById('messageBox').innerText = "¡Fallaste el tiro, intenta de nuevo!";
            }
        }

        function checkAnswer() {
            let val = parseFloat(document.getElementById('userAnswer').value);
            if (isNaN(val)) {
                document.getElementById('messageBox').innerText = "Ingresa un número válido.";
                return;
            }

            if (Math.abs(val - opData.correctSum) < 0.001) {
                document.getElementById('messageBox').style.color = '#2ecc71';
                document.getElementById('messageBox').innerText = "¡Correcto! 🎉 Puntos decimales colocados con éxito.";
                document.getElementById('answerSection').style.display = 'none';
            } else {
                document.getElementById('messageBox').style.color = '#e94560';
                document.getElementById('messageBox').innerText = "No se puede poner punto la respuesta es incorrecta.";
            }
        }
    </script>
</body>
</html>
