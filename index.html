<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego: Alineación Decimal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h2 { margin-bottom: 20px; color: #e94560; }
        
        /* Estilos de filas y bloques 3D */
        .row-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
            position: relative;
            height: 120px;
            justify-content: center;
            align-items: center;
        }
        .number-row {
            display: flex;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            transition: transform 0.1s ease;
        }
        .block-3d {
            background: linear-gradient(135deg, #0f3460, #1f4068);
            border: 2px solid #e94560;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 5px 0 #b32e43;
            display: inline-block;
        }
        /* Esfera vistosa para el punto */
        .sphere-dot {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ff6b6b, inset -2px -2px 4px rgba(0,0,0,0.5);
            align-self: center;
            margin: 0 5px;
        }
        
        /* Botones generales */
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #b32e43;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b32e43;
        }

        /* Sección de respuesta */
        .answer-section {
            display: none;
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 20px;
            width: 200px;
            text-align: center;
            border-radius: 5px;
            border: 2px solid #0f3460;
            margin-bottom: 15px;
        }
        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .flash {
            animation: flashEffect 0.3s ease;
        }
        @keyframes flashEffect {
            0% { background-color: #16213e; }
            50% { background-color: #ff6b6b; }
            100% { background-color: #16213e; }
        }
    </style>
</head>
<body>

    <div class="container" id="gameContainer">
        <h2>Alineación de Decimales</h2>
        <p id="instruction">Observa la operación y prepárate para alinear.</p>

        <div class="row-container" id="rowContainer">
            <!-- Se inyecta dinámicamente -->
        </div>

        <button class="btn" id="mainButton" onclick="handleButtonClick()">Iniciar</button>
        
        <div class="answer-section" id="answerSection">
            <input type="text" id="userAnswer" placeholder="Tu respuesta">
            <br>
            <button class="btn" onclick="checkAnswer()">Puntuar</button>
        </div>

        <div class="message" id="messageBox"></div>
    </div>

    <script>
        let gameState = 'waiting'; // waiting, playing, answering
        let animInterval;
        let offset1 = 0;
        let offset2 = 0;
        let speed1 = 3;
        let speed2 = -4;

        // Datos del reto actual (ejemplo: 73.4 + 13.579)
        const opData = {
            num1Text: "73 . 4",
            num2Text: "13 . 5 7 9",
            correctSum: 86.979
        };

        function initView() {
            const container = document.getElementById('rowContainer');
            container.innerHTML = `
                <div class="number-row">
                    <span class="block-3d">7 3</span>
                    <span style="color:#ff6b6b; font-size:28px;">.</span>
                    <span class="block-3d">4</span>
                </div>
                <div class="number-row">
                    <span class="block-3d">1 3</span>
                    <span style="color:#ff6b6b; font-size:28px;">.</span>
                    <span class="block-3d">5 7 9</span>
                </div>
            `;
        }
        initView();

        function handleButtonClick() {
            if (gameState === 'waiting') {
                // Cambiar a modo juego (esferas y movimiento discordante)
                gameState = 'playing';
                document.getElementById('mainButton').innerText = "Dispara";
                document.getElementById('instruction').innerText = "¡Dispara cuando las esferas se alineen!";
                startDiscordantMotion();
            } else if (gameState === 'playing') {
                // Intentar disparo
                tryShoot();
            }
        }

        function startDiscordantMotion() {
            const container = document.getElementById('rowContainer');
            animInterval = setInterval(() => {
                offset1 += speed1;
                offset2 += speed2;

                // Rebote en los límites
                if (offset1 > 60 || offset1 < -60) speed1 *= -1;
                if (offset2 > 60 || offset2 < -60) speed2 *= -1;

                container.innerHTML = `
                    <div class="number-row" style="transform: translateX(${offset1}px);">
                        <span class="block-3d">🔲 🔲</span>
                        <span class="sphere-dot"></span>
                        <span class="block-3d">🔲</span>
                    </div>
                    <div class="number-row" style="transform: translateX(${offset2}px);">
                        <span class="block-3d">🔲 🔲</span>
                        <span class="sphere-dot"></span>
                        <span class="block-3d">🔲 🔲 🔲</span>
                    </div>
                `;
            }, 30);
        }

        function tryShoot() {
            document.getElementById('gameContainer').classList.add('flash');
            setTimeout(() => document.getElementById('gameContainer').classList.remove('flash'), 300);

            // Verificar si la diferencia de posiciones (offset) es muy pequeña (alineados)
            let diferencia = Math.abs(offset1 - offset2);
            
            if (diferencia < 8) {
                // ¡Acierto!
                clearInterval(animInterval);
                document.getElementById('mainButton').style.display = 'none';
                document.getElementById('instruction').innerText = "¡Excelente! Escribe el resultado:";
                document.getElementById('answerSection').style.display = 'block';
                document.getElementById('messageBox').style.color = '#2ecc71';
                document.getElementById('messageBox').innerText = "¡Lograste la alineación!";
                gameState = 'answering';
            } else {
                // Fallo el disparo
                document.getElementById('messageBox').style.color = '#e94560';
                document.getElementById('messageBox').innerText = "¡Fallaste el tiro, intenta de nuevo!";
            }
        }

        function checkAnswer() {
            let val = parseFloat(document.getElementById('userAnswer').value);
            if (isNaN(val)) {
                document.getElementById('messageBox').innerText = "Ingresa un número válido.";
                return;
            }

            if (Math.abs(val - opData.correctSum) < 0.001) {
                document.getElementById('messageBox').style.color = '#2ecc71';
                document.getElementById('messageBox').innerText = "¡Correcto! 🎉";
                document.getElementById('answerSection').style.display = 'none';
            } else {
                document.getElementById('messageBox').style.color = '#e94560';
                document.getElementById('messageBox').innerText = "No se puede poner punto la respuesta es incorrecta.";
            }
        }
    </script>
</body>
</html>
